<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger Prop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
<div class="status">
<input id="clock" value="08:37">
<div>📶 LTE 🔋100%</div>
</div>
<div class="header">
<input id="name" value="민수">
</div>

<div id="chat" class="chat"></div>

<div class="controls">
<textarea id="msg" placeholder="메시지"></textarea>
<select id="who">
<option value="friend">상대</option>
<option value="me">나</option>
</select>
<input id="time" value="오후 8:37">
<button onclick="addMsg()">추가</button>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
